<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
body { width: 280px; font-family: Arial, sans-serif; padding: 12px; margin: 0; }
h1 { font-size: 15px; margin: 0 0 8px 0; }
p { font-size: 13px; color: #444; line-height: 1.4; }
button { width: 100%; padding: 8px; margin-top: 8px; border: 0; border-radius: 8px; background: #0f0f0f; color: #fff; cursor: pointer; }
button.secondary { background: #f2f2f2; color: #0f0f0f; }
#status { font-size: 12px; color: #606060; margin-top: 8px; }
</style>
</head>
<body>
<h1>YouTube Channel History</h1>
<p id="version">Version 0.2.4</p>
<p id="count">Loading...</p>
<p>Your watch history stays in this browser. Takeout imports are read locally and are not uploaded. Backfill sends video URLs to YouTube's public lookup service to resolve channel names.</p>
<button id="import" type="button">Import Google Takeout watch-history.json</button>
<input id="takeout-file" type="file" accept=".json,application/json" hidden>
<button id="backfill" type="button">Run backfill from browser history</button>
<button id="clear" class="secondary" type="button">Clear local watched list</button>
<div id="status"></div>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
